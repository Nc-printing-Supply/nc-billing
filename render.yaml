# Render Blueprint: web app (Docker) + PostgreSQL.
# Render → New → Blueprint → choose this repository.
services:
  - type: web
    name: nc-printing-billing
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nc-billing-db
          property: connectionString
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: nc-billing-db
    plan: free
    region: singapore
    databaseName: ncps
    user: ncps
